<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mikhail Makavetski — Full Stack Developer</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
           background: #f6f7fb; color: #14182b; text-align: center; padding: 16px; }
    a { color: #3d6bff; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #0f1220; color: #e8eaf3; } a { color: #7c9bff; } }
  </style>
  <script>
    // ============================================================
    // QR-code entry point (the sticker on the car leads here).
    // To change where the QR code leads, edit TARGET_URL and push.
    // Leave it empty to send visitors to the home page.
    // ============================================================
    var TARGET_URL = '/cv.pdf';

    var target = TARGET_URL || '/';

    // Optional: count QR scans in analytics before redirecting.
    // After you set up GoatCounter or Umami, send an event here.
    function track() {
      try {
        // GoatCounter example:
        // if (window.goatcounter && window.goatcounter.count) {
        //   window.goatcounter.count({ path: 'qr-car-scan', title: 'QR scan', event: true });
        // }
      } catch (e) {}
    }

    track();
    setTimeout(function () { window.location.replace(target); }, 300);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body>
  <p>🐺 Opening… If nothing happens, <a id="fallback" href="/">tap here</a>.</p>
  <script>document.getElementById('fallback').href = target;</script>
</body>
</html>
