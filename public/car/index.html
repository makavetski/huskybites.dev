<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mikhail Makavetski — Full Stack Developer</title>
  <!--
    QR-code entry point: the sticker on the car leads to https://huskybites.dev/car.
    This page passes the visitor on to the bot (…/go/car): the bot counts the scan, sends a Telegram
    message and redirects where the QR should lead. Change that target in Telegram: /qr car https://…
    STATS_URL = the bot's address (also in nuxt.config.ts → runtimeConfig.public.statsUrl).
  -->
  <meta http-equiv="refresh" content="2; url=https://huskybites-jobs-bot.huskybitesdev.workers.dev/go/car">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
           background: #f6f7fb; color: #14182b; text-align: center; padding: 16px; }
    a { color: #3d6bff; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #0f1220; color: #e8eaf3; } a { color: #7c9bff; } }
  </style>
  <script>
    var STATS_URL = 'https://huskybites-jobs-bot.huskybitesdev.workers.dev';
    var target = STATS_URL + '/go/car';
    window.location.replace(target);
  </script>
</head>
<body>
  <p>🐺 Opening… If nothing happens, <a href="https://huskybites-jobs-bot.huskybitesdev.workers.dev/go/car">tap here</a>.</p>
</body>
</html>
